<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusShare | Choose Role</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4b6cb7, #182848);
    }

    .card {
      background: white;
      padding: 30px;
      width: 360px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 20px;
      color: #182848;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      color: white;
    }

    .lender { background: #4b6cb7; }
    .borrower { background: #182848; }

    .logout {
      margin-top: 15px;
      font-size: 13px;
    }

    .logout a {
      color: #4b6cb7;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Choose Your Role</h1>

    <button class="lender" onclick="location.href='lender.html'">
      I am a Lender
    </button>

    <button class="borrower" onclick="location.href='borrower.html'">
      I am a Borrower
    </button>

    <div class="logout">
      <a href="login.html">Log out</a>
    </div>
  </div>

</body>
</html>
