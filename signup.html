<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusShare | Student Registration</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .card {
            background: white;
            padding: 40px;
            width: 380px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
        }

        h1 { color: #0e857b; margin-bottom: 5px; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        /* Center text for OTP input */
        #otp { text-align: center; letter-spacing: 3px; font-weight: bold; font-size: 18px; }
        
        input:focus { border-color: #11998e; outline: none; }

        button {
            width: 100%;
            padding: 14px;
            background-color: #11998e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover { background-color: #0b6e65; transform: translateY(-1px); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .hidden { display: none; }

        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            font-weight: bold;
            min-height: 20px;
        }

        .link { margin-top: 20px; font-size: 13px; color: #666; }
        a { color: #11998e; text-decoration: none; font-weight: bold; }
        
        /* Progress Dots (Optional Visual Flair) */
        .steps { display: flex; justify-content: center; gap: 5px; margin-bottom: 20px; }
        .dot { height: 8px; width: 8px; background: #ddd; border-radius: 50%; }
        .dot.active { background: #11998e; }
    </style>
</head>
<body>

    <div class="card">
        <div class="steps">
            <div class="dot active" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
        </div>

        <h1>Create Account</h1>
        
        <div id="step1">
            <p class="subtitle">Enter your university email</p>
            <input type="email" id="email" placeholder="name.123@lpu.in">
            <button onclick="sendOtp()" id="otpBtn">Send OTP</button>
        </div>

        <div id="step2" class="hidden">
            <p class="subtitle">Enter the 6-digit code sent to your email</p>
            <input type="text" id="otp" placeholder="123456" maxlength="6">
            <button onclick="verifyOtpLocal()" id="verifyBtn">Verify & Next</button>
            <p style="font-size: 11px; color: #888; margin-top: 10px; cursor: pointer; text-decoration: underline;" onclick="location.reload()">Wrong Email?</p>
        </div>

        <div id="step3" class="hidden">
            <p class="subtitle">Secure your account</p>
            <input type="text" id="username" placeholder="Choose a Username (e.g. Amar_CS)" maxlength="15" style="border-color:#11998e;">
            <input type="text" id="phone" placeholder="Phone Number (e.g. 9876543210)" maxlength="10">

            <input type="password" id="newPassword" placeholder="Create Password">
            <input type="password" id="confirmPassword" placeholder="Confirm Password">
            <button onclick="register()" id="regBtn">Create Account</button>
        </div>

        <div id="status" class="status-msg"></div>

        <div class="link">
            Already have an account? <a href="index.html">Login here</a>
        </div>
    </div>
    <script src="utils.js"></script>
    <script>
        // Concatenate the base URL with the specific endpoint
        const API_URL = `${API_BASE}/api/auth`;
        
        // Helper to switch steps
        function showStep(stepNumber) {
            document.getElementById("step1").classList.add("hidden");
            document.getElementById("step2").classList.add("hidden");
            document.getElementById("step3").classList.add("hidden");
            
            document.getElementById("step" + stepNumber).classList.remove("hidden");
            
            // Update dots
            document.getElementById("dot1").className = stepNumber >= 1 ? "dot active" : "dot";
            document.getElementById("dot2").className = stepNumber >= 2 ? "dot active" : "dot";
            document.getElementById("dot3").className = stepNumber >= 3 ? "dot active" : "dot";
        }

        async function sendOtp() {
            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("otpBtn");
            const status = document.getElementById("status");

            // 1. Strict Email Check
            if (!email.endsWith("@lpu.in")) {
                status.innerText = "❌ Please use your official @lpu.in email.";
                status.style.color = "red";
                return;
            }

            btn.innerText = "Sending Code...";
            btn.disabled = true;
            status.innerText = "";

            try {
                const res = await fetch(`${API_URL}/send-signup-otp`, {
                    method: "POST",
                    body: email
                });

                if (res.ok) {
                    showStep(2); // Move to OTP screen
                    status.innerText = "✨ OTP Sent! Check your inbox.";
                    status.style.color = "green";
                } else {
                    const errorText = await res.text();
                    status.innerText = "⚠️ " + errorText;
                    status.style.color = "#e67e22";
                    btn.innerText = "Send OTP";
                    btn.disabled = false;
                }
            } catch (e) {
                status.innerText = "❌ Server Error.";
                status.style.color = "red";
                btn.innerText = "Send OTP";
                btn.disabled = false;
            }
        }

        // 2. Local OTP Check (Moves to Step 3)
        function verifyOtpLocal() {
            const otp = document.getElementById("otp").value.trim();
            const status = document.getElementById("status");

            if (otp.length < 6) {
                status.innerText = "⚠️ Please enter the full 6-digit code.";
                status.style.color = "orange";
                return;
            }

            // If length is okay, we assume it's valid for now and let them set a password.
            // The REAL verification happens at the final step.
            status.innerText = "";
            showStep(3); // Move to Password screen
        }

        async function register() {
            const email = document.getElementById("email").value.trim();
            const otp = document.getElementById("otp").value.trim();
            
            // ✅ GET USERNAME
            const username = document.getElementById("username").value.trim();
            const phone = document.getElementById("phone").value.trim(); // Get Phone
            if (phone.length < 10) return alert("Enter valid phone number");

            const p1 = document.getElementById("newPassword").value;
            const p2 = document.getElementById("confirmPassword").value;
            const btn = document.getElementById("regBtn");
            const status = document.getElementById("status");

            // 1. Username Validation (New)
            if (username.length < 3) {
                status.innerText = "⚠️ Username must be at least 3 characters.";
                status.style.color = "orange";
                return;
            }

            // 2. Password Match Validation (Kept from your old code)
            if (p1 !== p2) {
                status.innerText = "❌ Passwords do not match!";
                status.style.color = "red";
                return;
            }
            
            // 3. Strong Password Regex (Kept from your old code)
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!passwordRegex.test(p1)) {
                status.innerText = "⚠️ Password weak! Use 8+ chars, 1 Capital, 1 Number & 1 Symbol.";
                status.style.color = "orange";
                return;
            }

            btn.innerText = "Creating Account...";
            btn.disabled = true;

            try {
                // Send everything to Backend to Finalize
                const res = await fetch(`${API_URL}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    // ✅ SEND USERNAME AND PHONE HERE
                    body: JSON.stringify({ email, otp, password: p1, username: username, phoneNumber: phone })
                });

                if (res.ok) {
                    status.innerText = "🎉 Success! Redirecting to Login...";
                    status.style.color = "green";
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);
                } else {
                    // This handles if the OTP was actually wrong
                    const errorMsg = await res.text();
                    status.innerText = "❌ " + errorMsg;
                    status.style.color = "red";
                    btn.innerText = "Create Account";
                    btn.disabled = false;
                    
                    // If OTP is wrong, send them back to Step 2 (Kept your logic)
                    if (errorMsg.includes("Invalid OTP")) {
                        setTimeout(() => showStep(2), 1500);
                    }
                }
            } catch (e) {
                status.innerText = "❌ Registration Error.";
                status.style.color = "red";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
