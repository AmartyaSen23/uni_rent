<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusShare | My Rentals</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f2f4f8; padding: 30px; }
    h1 { color: #182848; }
    a { text-decoration: none; color: #4b6cb7; font-weight: bold; }
    
    .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    /* Status Borders */
    .status-requested { border-left: 5px solid #007bff; }
    .status-rejected { border-left: 5px solid #dc3545; }
    .status-pending { border-left: 5px solid orange; }
    .status-rented { border-left: 5px solid #28a745; }

    .btn-pay { background: #007bff; color: white; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-return { background: #d9534f; color: white; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-rate { background: #ffc107; color: #333; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; margin-right: 5px; }
    .btn-rate-item { background: #17a2b8; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    
    /* ⭐ RATING MODAL STYLES */
    .star-rating { font-size: 30px; cursor: pointer; color: #ccc; transition: color 0.2s; }
    .star-rating.active { color: #ffc107; } /* Gold Color */
    .star-rating:hover { color: #ffdb58; }
    
    .rating-container { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }

    input { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="utils.js"></script>
</head>
<body>

  <a href="borrower.html">← Back to Browse</a>
  <h1>My Borrowed Items</h1>
  <div id="container">Loading...</div>
  <div id="ratingModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <div class="icon-circle" style="background:#fff8e1; color:#ffc107;">⭐</div>
        <h2 id="ratingTitle">Rate Experience</h2>
        <p style="color:#666; font-size:13px; margin-bottom:10px;">How was your experience?</p>
        
        <div class="rating-container">
            <span class="star-rating" onclick="setStars(1)">★</span>
            <span class="star-rating" onclick="setStars(2)">★</span>
            <span class="star-rating" onclick="setStars(3)">★</span>
            <span class="star-rating" onclick="setStars(4)">★</span>
            <span class="star-rating" onclick="setStars(5)">★</span>
        </div>

        <input type="hidden" id="ratingValue">
        <input type="hidden" id="ratingTargetId">
        <input type="hidden" id="ratingType"> <button onclick="submitRating()" class="btn-pay" style="width:100%; margin-bottom:10px;">Submit Rating</button>
        <button onclick="closeRatingModal()" class="cancel-btn">Cancel</button>
    </div>
  </div>
  <script>
    const userEmail = localStorage.getItem("userEmail");
    if (!userEmail) window.location.href = "login.html";

    async function loadItems() {
        const container = document.getElementById("container");
        const res = await authFetch(`${API_BASE}/api/items/borrowed/${userEmail}`);
        const items = await res.json();
        container.innerHTML = "";

        if (items.length === 0) {
            container.innerHTML = "<p>No active rentals.</p>";
            return;
        }

        for (const item of items) {
            const card = document.createElement("div");
            card.className = "card";

            // --- 1. REQUEST SENT (Waiting) ---
            if (item.status === "REQUESTED") {
                card.classList.add("status-requested");
                // REPLACE the innerHTML for REQUESTED with this:
                card.innerHTML = `
                    <h3>${escapeHtml(item.name)}</h3>
                    <p><strong>Status:</strong> <span style="color:#007bff; font-weight:bold;">⏳ Request Sent</span></p>
                    <p style="color:#666; font-size:13px;">Waiting for approval...</p>
                `;
            }
            // --- 2. REJECTED (Dismiss) ---
            else if (item.status === "REJECTED") {
                card.classList.add("status-rejected");
                card.innerHTML = `
                    <h3>${escapeHtml(item.name)}</h3>
                    <p><strong>Status:</strong> <span style="color:#dc3545; font-weight:bold;">⛔ Request Rejected</span></p>
                    <p style="color:#666; font-size:13px;">The lender cannot rent this item to you right now.</p>
                    <button onclick="dismissRejection('${escapeHtml(item.id)}')" style="background:#6c757d; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">Dismiss & Remove</button>
                `;
            }
            // --- 3. APPROVED (Handshake) ---
            // ... inside loadItems loop ...
            else if (item.status === "PENDING") {
                card.classList.add("status-pending");
                card.innerHTML = `
                    <h3>${escapeHtml(item.name)}</h3>
                    <p><strong>🎉 Approved!</strong> Meet <strong>${escapeHtml(item.lenderName || "Lender")}</strong></p>
                    <div style="margin:10px 0; color:#555; font-size:13px;">
                        Lender: <strong>${escapeHtml(item.lenderName)}</strong><br>
                        📞 <a href="tel:${escapeHtml(item.lenderPhone)}" style="color:#007bff;">${escapeHtml(item.lenderPhone || "Not Provided")}</a>
                    </div><br>
                    <div style="background:#fff3cd; padding:10px; border-radius:5px; margin-bottom:10px;">
                        Show this code to Lender:<br>
                        <strong style="font-size:18px; letter-spacing:2px;">(Pending Pickup)</strong>
                    </div>
                    
                    <input type="text" id="otp-${escapeHtml(item.id)}" placeholder="Enter Lender's Code">
                    <button class="btn-pay" onclick="confirmPickup('${escapeHtml(item.id)}')">Confirm Receipt</button>
                    
                    <div style="margin-top:10px; border-top:1px solid #eee; padding-top:10px;">
                        <button onclick="cancelPickup('${escapeHtml(item.id)}')" style="background:transparent; color:#d9534f; border:1px solid #d9534f; padding:5px 10px; border-radius:4px; font-size:12px; cursor:pointer;">
                            🚫 Changed my mind (Cancel Pickup)
                        </button>
                    </div>
                `;
            } 
            // --- 4. ACTIVE RENTAL (Rating & Payment) ---
            else if (item.status === "RENTED") {
                card.classList.add("status-rented");
                
                // Get Due Amount
                const dueRes = await authFetch(`${API_BASE}/api/items/due/${escapeHtml(item.id)}`);
                const dueAmount = await dueRes.json();

                let actionHtml = "";

                if (dueAmount > 0) {
                    // USER OWES MONEY
                    actionHtml = `
                        <p style="color:red; font-weight:bold;">Due Balance: ₹${dueAmount}</p>
                        <button class="btn-pay" onclick="payNow('${escapeHtml(item.id)}', ${dueAmount})">Pay Full Amount</button>
                        <p style="font-size:12px; color:gray;">(Clear dues to return item)</p>
                    `;
                } else {
                    // BILL CLEARED -> CAN RETURN
                    actionHtml = `
                        <p style="color:green; font-weight:bold;">Balance: ₹0 (Paid)</p>
                        <div style="background:#f9f9f9; padding:10px; border:1px solid #ddd; border-radius:5px;">
                            <strong>End Rental:</strong><br>
                            Ask Lender for Return Code: 
                            <input type="text" id="return-${escapeHtml(item.id)}" placeholder="0000" style="width:80px; margin-top:5px;">
                            <button class="btn-return" onclick="returnItem('${escapeHtml(item.id)}')">Return</button>
                        </div>
                    `;
                }

                // ⭐ RATING BUTTONS INCLUDED HERE
                // ⭐ SMART RATING BUTTONS
                let rateLenderBtn = "";
                let rateItemBtn = "";

                // Logic for Lender Button
                if (item.lenderRated) {
                    rateLenderBtn = `<button disabled style="background:#ccc; color:#666; padding:5px 10px; border:none; border-radius:4px; font-size:12px; margin-right:5px;">✅ Lender Rated</button>`;
                } else {
                    rateLenderBtn = `<button class="btn-rate" onclick="openRatingModal('USER', '${escapeHtml(item.id)}')">⭐ Rate User</button>`; // Passing ITEM ID now!
                }

                // Logic for Item Button
                if (item.itemRated) {
                    rateItemBtn = `<button disabled style="background:#ccc; color:#666; padding:5px 10px; border:none; border-radius:4px; font-size:12px;">✅ Item Rated</button>`;
                } else {
                    rateItemBtn = `<button class="btn-rate-item" onclick="openRatingModal('ITEM', '${escapeHtml(item.id)}')">🚲 Rate Item</button>`;
                }

                // Add to HTML
                card.innerHTML = `
                    <h3>${escapeHtml(item.name)}</h3>
                    <p>Lender: ${escapeHtml(item.lenderEmail)} | ₹${escapeHtml(item.pricePerDay)}/day</p>
                    <div style="margin:10px 0; color:#555; font-size:13px;">
                        Lender: <strong>${escapeHtml(item.lenderName)}</strong><br>
                        📞 <a href="tel:${escapeHtml(item.lenderPhone)}" style="font-weight:bold; color:#007bff;text-decoration: none;">${escapeHtml(item.lenderPhone || "Not Provided")}</a>
                    </div><br>
                    <div style="margin: 10px 0; padding:10px; background:#eeffe0; border-radius:5px;">
                        <span style="font-size:12px; font-weight:bold; color:#2e7d32;">Rate Experience:</span><br>
                        <div style="margin-top:5px;">
                            ${rateLenderBtn}
                            ${rateItemBtn}
                        </div>
                    </div>

                    ${actionHtml}
                `;
            }
            container.appendChild(card);
        }
    }

    // --- NEW: DISMISS REJECTION ---
    async function dismissRejection(itemId) {
        if(!confirm("Remove this item from your list?")) return;
        await authFetch(`${API_BASE}/api/items/dismiss-rejection/${itemId}`, { method: "POST" });
        loadItems();
    }

    // --- NEW: RATING FUNCTIONS ---
    // --- 1. OPEN MODAL (Smart Logic) ---
    function openRatingModal(type, targetId) {
        document.getElementById("ratingModal").style.display = "flex";
        document.getElementById("ratingTargetId").value = targetId;
        document.getElementById("ratingType").value = type;
        document.getElementById("ratingValue").value = "0";
        
        // Reset Visuals
        resetStars(0);

        // Change Title based on type
        const title = type === 'USER' ? "Rate the Lender" : "Rate the Item";
        document.getElementById("ratingTitle").innerText = title;
    }

    function closeRatingModal() {
        document.getElementById("ratingModal").style.display = "none";
    }

    // --- 2. STAR CLICK LOGIC ---
    function setStars(count) {
        document.getElementById("ratingValue").value = count;
        resetStars(count);
    }

    function resetStars(count) {
        const stars = document.getElementsByClassName("star-rating");
        for (let i = 0; i < stars.length; i++) {
            if (i < count) stars[i].classList.add("active");
            else stars[i].classList.remove("active");
        }
    }

    // --- 3. SUBMIT (Sends to Backend) ---
    async function submitRating() {
        const type = document.getElementById("ratingType").value;
        const targetItemId = document.getElementById("ratingTargetId").value; // This is now Item ID for BOTH
        const stars = parseInt(document.getElementById("ratingValue").value);

        if (stars === 0) return alert("Please click a star!");

        const btn = document.querySelector("#ratingModal .btn-pay");
        btn.innerText = "Sending...";
        btn.disabled = true;

        try {
            let url = "";
            
            // 🔄 UPDATED ENDPOINTS
            if (type === 'USER') {
                // New Endpoint that checks "lenderRated" flag
                url = `http://localhost:8080/api/items/rate-lender-transaction/${targetItemId}`;
            } else {
                url = `http://localhost:8080/api/items/rate-item/${targetItemId}`;
            }

            const res = await authFetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(stars) // Just sending the number now for both!
            });

            if (res.ok) {
                alert("Rating Saved! ⭐");
                closeRatingModal();
                loadItems(); // Refresh to disable the button
            } else {
                alert("Error: " + await res.text());
            }
        } catch (e) { console.error(e); }
        finally { btn.innerText = "Submit Rating"; btn.disabled = false; }
    }

    // --- EXISTING FUNCTIONS (Unchanged) ---
    async function confirmPickup(id) {
        const code = document.getElementById(`otp-${id}`).value;
        const res = await authFetch(`${API_BASE}/api/items/confirm/${id}`, { method: "POST", body: code });
        if (res.ok) { alert("Rental Started! 🚀"); loadItems(); } else alert("Wrong Code");
    }

    async function payNow(id, amount) {
        try {
            const orderRes = await authFetch(`${API_BASE}/api/payment/create-order/${id}`, { method: "POST" });
            if (!orderRes.ok) return alert("Error creating order");
            const orderData = await orderRes.json();

            var options = {
                "key": orderData.keyId, "amount": orderData.amount, "currency": "INR",
                "name": "CampusShare", "description": "Rental Fee",
                "order_id": orderData.orderId,
                "handler": async function (response){
                    const verifyRes = await authFetch(`${API_BASE}/api/payment/verify-payment/${id}`, { method: "POST" });
                    if (verifyRes.ok) { alert("Paid! ✅"); loadItems(); }
                },
                "theme": { "color": "#182848" }
            };
            new Razorpay(options).open();
        } catch (e) { alert("Payment Error"); }
    }

    async function returnItem(id) {
        const code = document.getElementById(`return-${id}`).value;
        const res = await authFetch(`${API_BASE}/api/items/return/${id}`, { method: "POST", body: code });
        if (res.ok) { alert("Returned! 🤝"); loadItems(); } else alert("Wrong Return Code");
    }

    loadItems();
    async function cancelPickup(itemId) {
        if(!confirm("Are you sure? This will cancel the deal.")) return;
        await authFetch(`${API_BASE}/api/items/cancel-pickup/${itemId}`, { method: "POST" });
        loadItems(); // Refresh
    }
  </script>

</body>
</html>
